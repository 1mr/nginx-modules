name: Build Nginx Modules

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: Nginx version
        default: '1.30.2'
        required: true
  push:
    branches: ['master', 'main']
    paths:
      - modules.sh
      - ngx_brotli/Dockerfile
      - ngx_geoip2/Dockerfile
      - ngx_vts/Dockerfile

permissions:
  contents: write

jobs:
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ngx_brotli, ngx_geoip2, ngx_vts]
        platform: [linux/amd64, linux/arm64]

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set arch
        run: |
          ARCH=$(echo '${{ matrix.platform }}' | tr '/' '-')
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"
          echo "TARGETARCH=${ARCH#linux-}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.module }}
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg NGINX_VERSION=${{ needs.check.outputs.nginx_version }} \
            --build-arg TARGETARCH=${{ env.TARGETARCH }} \
            --output type=local,dest=./output \
            -f ${{ matrix.module }}/Dockerfile \
            .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}-${{ needs.check.outputs.nginx_version }}-${{ env.ARCH }}
          path: ./output/

  release:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Package artifacts
        run: |
          for dir in ./artifacts/*/; do
            name=$(basename "$dir")
            cd "$(pwd)/${dir}${{ needs.check.outputs.nginx_version }}"
            tar -czf "${root}/${name}.tar.gz" .
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nginx-${{ needs.check.outputs.nginx_version }}
          name: Nginx ${{ needs.check.outputs.nginx_version }} Modules
          make_latest: true
          files: '*.tar.gz'
