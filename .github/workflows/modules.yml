name: Build Nginx Modules

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: Nginx version
        default: '1.30.4'
        required: true
  push:
    branches: ['master', 'main']
    paths:
      - modules.sh
      - ngx_brotli/Dockerfile
      - ngx_geoip2/Dockerfile
      - ngx_vts/Dockerfile
      - .github/workflows/modules.yml

permissions:
  contents: write

env:
  NGINX_VERSION: ${{ inputs.nginx_version || '1.30.4' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ngx_brotli, ngx_geoip2, ngx_vts]
        platform: [linux/amd64, linux/arm64]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Set arch
        run: |
          ARCH=$(echo '${{ matrix.platform }}' | tr '/' '-')
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"
          echo "TARGETARCH=${ARCH#linux-}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.module }}
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg NGINX_VERSION=${{ env.NGINX_VERSION }} \
            --build-arg TARGETARCH=${{ env.TARGETARCH }} \
            --output type=local,dest=./output \
            -f ${{ matrix.module }}/Dockerfile \
            .

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.module }}-${{ env.NGINX_VERSION }}-${{ env.ARCH }}
          path: ./output/

  release:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts

      - name: Package artifacts
        run: |
          root=$(pwd)
          for dir in ./artifacts/*/; do
            arch=$(basename "$dir" | grep -oP 'linux-\w+$')
            for so in "${dir}${{ env.NGINX_VERSION }}"/*.so; do
              name=$(basename "$so" .so)
              tar -czf "${root}/${name}-${arch}.tar.gz" -C "$(dirname "$so")" "$(basename "$so")"
            done
          done

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nginx-${{ env.NGINX_VERSION }}
          name: Nginx ${{ env.NGINX_VERSION }} Modules
          make_latest: true
          files: '*.tar.gz'
