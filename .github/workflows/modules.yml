name: Build Nginx Modules

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: Nginx version
        default: '1.30.6'
        required: true
  push:
    branches: ['master', 'main']
    paths:
      - modules.sh
      - ngx_brotli/Dockerfile
      - ngx_geoip2/Dockerfile
      - ngx_vts/Dockerfile
      - .github/workflows/modules.yml

permissions:
  contents: write

env:
  NGINX_VERSION: ${{ inputs.nginx_version || '1.30.6' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ngx_brotli, ngx_geoip2, ngx_vts]
        platform: [linux/amd64, linux/arm64]
        debian: ['12', '13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set arch
        run: |
          ARCH=$(echo '${{ matrix.platform }}' | tr '/' '-')
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"
          echo "TARGETARCH=${ARCH#linux-}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.module }}
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg NGINX_VERSION=${{ env.NGINX_VERSION }} \
            --build-arg DEBIAN_VERSION=${{ matrix.debian }} \
            --build-arg TARGETARCH=${{ env.TARGETARCH }} \
            --output type=local,dest=./output \
            -f ${{ matrix.module }}/Dockerfile \
            .

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.module }}-${{ env.NGINX_VERSION }}-debian${{ matrix.debian }}-${{ env.ARCH }}
          path: ./output/

  release:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Package artifacts
        run: |
          root=$(pwd)
          for dir in ./artifacts/*/; do
            base=$(basename "$dir")
            arch=$(echo "$base" | grep -oP 'linux-\w+$')
            distro=$(echo "$base" | grep -oP 'debian\d+')
            for so in "${dir}${{ env.NGINX_VERSION }}/${distro}"/*.so; do
              name=$(basename "$so" .so)
              tar -czf "${root}/${name}-${distro}-${arch}.tar.gz" -C "$(dirname "$so")" "$(basename "$so")"
            done
          done

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nginx-${{ env.NGINX_VERSION }}
          name: Nginx ${{ env.NGINX_VERSION }} Modules
          make_latest: true
          files: '*.tar.gz'
