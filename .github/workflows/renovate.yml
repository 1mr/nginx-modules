name: Renovate

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: renovatebot/github-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
