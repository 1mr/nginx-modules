name: Renovate

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: renovatebot/github-action@v46.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
